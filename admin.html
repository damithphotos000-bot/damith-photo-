<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Damith Photo — Admin</title>

  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <!-- LOGIN -->

  <section id="loginScreen" class="login-screen">

    <div class="login-box">

      <div class="admin-logo">
        D
      </div>

      <p class="eyebrow">
        DAMITH PHOTO
      </p>

      <h1>
        Private Admin
      </h1>

      <p class="login-text">
        Management access only.
      </p>

      <form id="loginForm">

        <label for="adminEmail">
          Email
        </label>

        <input
          id="adminEmail"
          type="email"
          autocomplete="username"
          placeholder="Admin email"
          required
        >

        <label for="adminPassword">
          Password
        </label>

        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

        <p id="loginMessage"></p>

      </form>

    </div>

  </section>


  <!-- ADMIN PANEL -->

  <section id="adminPanel" class="admin-panel hidden">

    <header class="admin-header">

      <div>

        <p class="eyebrow">
          DAMITH PHOTO
        </p>

        <h1>
          Media Manager
        </h1>

      </div>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </header>


    <main class="admin-content">


      <!-- CATEGORY -->

      <section class="admin-card">

        <p class="eyebrow">
          CATEGORY
        </p>

        <h2>
          Choose Album
        </h2>

        <select id="categorySelect">

          <option value="Wedding">
            Wedding
          </option>

          <option value="Wedding Pre Shoot">
            Wedding Pre Shoot
          </option>

          <option value="Wedding Day">
            Wedding Day
          </option>

          <option value="Birthday Shoots">
            Birthday Shoots
          </option>

          <option value="Events">
            Events
          </option>

          <option value="Portrait">
            Portrait
          </option>

          <option value="Models">
            Models
          </option>

          <option value="Cinematic">
            Cinematic
          </option>

        </select>

      </section>


      <!-- UPLOAD -->

      <section class="admin-card">

        <p class="eyebrow">
          MEDIA
        </p>

        <h2>
          Add Photos / Videos
        </h2>

        <input
          id="mediaFiles"
          type="file"
          accept="image/*,video/*"
          multiple
        >

        <button
          id="uploadButton"
          type="button"
        >
          Upload Media
        </button>

        <div
          id="uploadStatus"
          class="upload-status"
        ></div>

      </section>


      <!-- MEDIA LIST -->

      <section class="admin-card">

        <p class="eyebrow">
          LIBRARY
        </p>

        <h2>
          Uploaded Media
        </h2>

        <div
          id="mediaGrid"
          class="media-grid"
        ></div>

      </section>

    </main>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>
</html>
